[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mongo-memories-server"
version = "1.0.0"
requires-python = ">=3.10"

dependencies = [
    "fastmcp",
    "pydantic",
    "pydantic-settings",
    "pymongo",
    "python-dotenv",
    "PyYAML",
]

optional-dependencies = { dev = ["pytest>=8.0", "pytest-asyncio>=0.23.0"] }

[tool.setuptools]
py-modules = ["server", "models", "utils", "capabilities", "config", "policy", "collectors"]

[tool.pytest.ini_options]
asyncio_mode = "auto"