name: Publish

on:
    push:
        branches:
            - main
            - master
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    publish:
        name: Publish package and MCP registry
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python 3.11
              uses: actions/setup-python@v6
              with:
                  python-version: 3.11
                  cache: "pip"

            - name: Install build tools
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install build twine

            - name: Build package
              working-directory: ./get_system_resources
              run: python -m build --sdist --wheel

            - name: Publish to package registry
              if: secrets.PYPI_API_TOKEN != ''
              working-directory: ./get_system_resources
              env:
                  TWINE_USERNAME: __token__
                  TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
              run: |
                  python -m twine upload --non-interactive dist/*

            - name: Publish to MCP registry
              if: secrets.MCP_REGISTRY_TOKEN != ''
              env:
                  MCP_REGISTRY_TOKEN: ${{ secrets.MCP_REGISTRY_TOKEN }}
                  MCP_REGISTRY_URL: ${{ secrets.MCP_REGISTRY_URL }}
              run: |
                  echo "MCP registry publish is enabled."
                  echo "Replace this step with your MCP registry upload command."
                  echo "Example: mcp publish --url $MCP_REGISTRY_URL --token $MCP_REGISTRY_TOKEN dist/*"
