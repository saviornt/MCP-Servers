name: CI

on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master
    workflow_dispatch:

jobs:
    test:
        name: Python test matrix
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip build wheel setuptools
                  python -m pip install -e ./get_system_resources
                  python -m pip install pytest

            - name: Run tests
              run: python -m pytest

            - name: Build package artifacts
              working-directory: ./get_system_resources
              run: python -m build --sdist --wheel

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: get-system-resources-dist
                  path: get_system_resources/dist
