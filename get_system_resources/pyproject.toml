[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "get-system-resources"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "fastmcp",
    "psutil",
    "pydantic",
    "nvidia-ml-py",
    "pyrsmi",
]

[tool.setuptools]
py-modules = [
    "server",
    "models",
    "utils"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["collectors*"]