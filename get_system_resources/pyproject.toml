[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "get-system-resources"
version = "1.0.5"
requires-python = ">=3.10"

dependencies = [
    "fastmcp",
    "psutil",
    "pydantic",
    "nvidia-ml-py",
    "pyrsmi",
]

optional-dependencies = { dev = ["pytest>=8.0", "pytest-asyncio>=0.23.0"] }

[tool.setuptools]
py-modules = [
    "server",
    "models",
    "utils",
    "capabilities",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["collectors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"